name: Deploy Khaled portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
