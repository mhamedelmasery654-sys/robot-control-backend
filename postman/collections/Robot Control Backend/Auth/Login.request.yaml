$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) { const body = pm.response.json(); pm.environment.set('accessToken', body.data.token); }
      pm.test('Login succeeded', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
